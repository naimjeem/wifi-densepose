<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi DensePose - Building Layout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: 'Courier New', 'Consolas', monospace;
      color: #88bbdd;
    }
    #viz-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #050510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-title {
      font-size: 22px;
      color: #aaddff;
      margin-bottom: 16px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .loading-bar-track {
      width: 280px;
      height: 3px;
      background: #112233;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0066ff, #00ccff);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .loading-status {
      font-size: 11px;
      color: #446688;
    }
  </style>
</head>
<body>
  <div id="viz-container">
    <!-- Loading overlay -->
    <div id="loading-overlay">
      <div class="loading-title">Building Layout</div>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loading-fill"></div>
      </div>
      <div class="loading-status" id="loading-status">Initializing...</div>
    </div>
  </div>

  <!-- Stats.js for performance monitoring -->
  <script src="https://unpkg.com/stats.js@0.17.0/build/stats.min.js"></script>

  <!-- Three.js r147 + OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

  <script type="module">
    import { Scene } from './components/scene.js';
    import { BodyModelManager } from './components/body-model.js';
    import { Environment } from './components/environment.js';
    import { DashboardHUD } from './components/dashboard-hud.js';
    import { WebSocketClient } from './services/websocket-client.js';
    import { DataProcessor } from './services/data-processor.js';

    const state = {
      scene: null,
      environment: null,
      bodyModelManager: null,
      hud: null,
      wsClient: null,
      dataProcessor: null,
      stats: null,
      isDemoMode: true,
      lastServerData: null,
      serverSensingMode: 'Connecting...',
      startTime: Date.now()
    };

    function setLoadingProgress(pct, msg) {
      const fill = document.getElementById('loading-fill');
      const status = document.getElementById('loading-status');
      if (fill) fill.style.width = pct + '%';
      if (status) status.textContent = msg;
    }

    function hideLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.classList.add('hidden');
      setTimeout(() => {
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 700);
    }

    function initStats() {
      const stats = new Stats();
      stats.showPanel(0);
      stats.dom.style.position = 'absolute';
      stats.dom.style.top = '40px';
      stats.dom.style.right = '12px';
      document.getElementById('viz-container').appendChild(stats.dom);
      return stats;
    }

    async function init() {
      const container = document.getElementById('viz-container');

      try {
        setLoadingProgress(10, 'Creating scene...');

        // Scene setup (top-down default camera)
        state.scene = new Scene(container);
        const camera = state.scene.getCamera();
        camera.position.set(0, 14, 0.001);
        camera.lookAt(0, 0, 0);

        setLoadingProgress(30, 'Building layout...');

        // Environment with realistic building layout
        state.environment = new Environment(state.scene.getScene());

        setLoadingProgress(45, 'Preparing person models...');

        // Body models (for exact in-room position)
        state.bodyModelManager = new BodyModelManager(state.scene.getScene());

        setLoadingProgress(60, 'Creating HUD...');

        state.hud = new DashboardHUD(container);

        setLoadingProgress(70, 'Initializing data processor...');

        state.dataProcessor = new DataProcessor({
          roomWidth: state.environment.roomWidth,
          roomDepth: state.environment.roomDepth
        });

        setLoadingProgress(80, 'Setting up Stats...');

        state.stats = initStats();

        setLoadingProgress(90, 'Connecting to server...');

        const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        state.wsClient = new WebSocketClient({
          url: `${wsProto}//${location.host}/api/v1/stream/pose`,
          onMessage: (msg) => handleWebSocketMessage(msg),
          onStateChange: (newState, oldState) => handleConnectionStateChange(newState, oldState),
          onError: (err) => console.error('[BUILDING VIZ] WebSocket error:', err)
        });

        state.wsClient.connect();

        setLoadingProgress(95, 'Starting render loop...');

        state.scene.onUpdate((delta, elapsed) => {
          mainUpdate(delta, elapsed);
        });

        state.scene.start();
        setLoadingProgress(100, 'Ready');
        setTimeout(hideLoading, 400);

        console.log('[BUILDING VIZ] Initialization complete');
      } catch (err) {
        console.error('[BUILDING VIZ] Initialization failed:', err);
        setLoadingProgress(100, 'Error: ' + err.message);
      }
    }

    function mainUpdate(delta, elapsed) {
      if (state.stats) state.stats.begin();

      let vizData = null;

      if (state.isDemoMode) {
        vizData = state.dataProcessor.generateDemoData(delta);
      }

      if (vizData) {
        state.bodyModelManager.update(vizData.persons, delta);
        state.environment.updateZoneOccupancy(vizData.zoneOccupancy);

        const heatmap = state.dataProcessor.generateConfidenceHeatmap(
          vizData.persons, 20, 15
        );
        state.environment.updateConfidenceHeatmap(heatmap);
        state.environment.updateMotionTrails(vizData.persons, elapsed);
      } else if (state.lastServerData && state.lastServerData.persons) {
        state.environment.updateMotionTrails(state.lastServerData.persons, elapsed);
      }

      state.environment.update(delta, elapsed);

      if (state.hud) {
        state.hud.tickFPS();

        const wsMetrics = state.wsClient.getMetrics();
        let sensingMode;
        if (state.isDemoMode) {
          sensingMode = state.wsClient.state === 'connected' ? 'Connecting...' : 'Demo';
        } else {
          sensingMode = state.serverSensingMode || (wsMetrics.dataSource || 'Server');
        }

        const activeData = state.isDemoMode ? vizData : state.lastServerData;
        let primaryLocation = '--';
        let primaryRoom = '--';
        let primaryPosture = '--';

        if (activeData && activeData.persons && activeData.persons.length > 0) {
          const p0 = activeData.persons[0];
          if (p0.worldPosition && state.environment) {
            const { x, z } = p0.worldPosition;
            primaryLocation = `${x.toFixed(2)}m, ${z.toFixed(2)}m`;
            const room = state.environment.getRoomForPosition(x, z);
            if (room) {
              primaryRoom = room.name || room.id || primaryRoom;
            }
          }
          if (p0.pose_state) {
            primaryPosture = p0.pose_state;
          }
        }

        state.hud.updateState({
          connectionStatus: state.wsClient.state,
          isRealData: !state.isDemoMode,
          latency: wsMetrics.latency,
          messageCount: wsMetrics.messageCount,
          uptime: wsMetrics.uptime,
          personCount: state.bodyModelManager.getActiveCount(),
          confidence: state.bodyModelManager.getAverageConfidence(),
          sensingMode,
          primaryLocation,
          primaryRoom,
          primaryPosture
        });
      }

      if (state.stats) state.stats.end();
    }

    function handleWebSocketMessage(message) {
      const processed = state.dataProcessor.processMessage(message);
      if (!processed) return;

      if (processed.metadata.sensingMode && processed.metadata.sensingMode !== 'Unknown') {
        state.serverSensingMode = processed.metadata.sensingMode;
      }

      if (processed.nodes && processed.nodes.length > 0 && state.environment) {
        state.environment.updateWifiNodes(processed.nodes);
      }

      if (processed.persons.length > 0) {
        if (state.isDemoMode) {
          state.isDemoMode = false;
          console.log(`[BUILDING VIZ] Switched to live data mode (source: ${processed.metadata.sensingMode})`);
        }

        state.lastServerData = processed;
        state.bodyModelManager.update(processed.persons, 0.016);
        state.environment.updateZoneOccupancy(processed.zoneOccupancy);

        const heatmap = state.dataProcessor.generateConfidenceHeatmap(
          processed.persons, 20, 15
        );
        state.environment.updateConfidenceHeatmap(heatmap);
      } else if (!state.isDemoMode) {
        state.bodyModelManager.update([], 0.016);
        state.lastServerData = processed;
      }
    }

    function handleConnectionStateChange(newState, oldState) {
      console.log(`[BUILDING VIZ] Connection: ${oldState} -> ${newState}`);

      if (newState === 'connected') {
        console.log('[BUILDING VIZ] Connected to server, waiting for pose data...');
      } else if (newState === 'error' || newState === 'disconnected') {
        if (!state.isDemoMode) {
          state.isDemoMode = true;
          state.serverSensingMode = 'Reconnecting...';
          console.log('[BUILDING VIZ] Fell back to demo mode (server unavailable)');
        }
      }
    }

    window.addEventListener('beforeunload', () => {
      if (state.wsClient) state.wsClient.dispose();
      if (state.bodyModelManager) state.bodyModelManager.dispose();
      if (state.environment) state.environment.dispose();
      if (state.hud) state.hud.dispose();
      if (state.scene) state.scene.dispose();
    });

    document.addEventListener('keydown', (e) => {
      switch (e.key.toLowerCase()) {
        case 'r':
          if (state.scene) state.scene.resetCamera();
          break;
        case 'd':
          state.isDemoMode = !state.isDemoMode;
          console.log(`[BUILDING VIZ] Demo mode: ${state.isDemoMode ? 'ON' : 'OFF'}`);
          break;
        case 'c':
          if (state.wsClient) {
            state.wsClient.disconnect();
            state.wsClient.autoReconnect = true;
            state.wsClient.reconnectAttempts = 0;
            state.wsClient.connect();
          }
          break;
      }
    });

    init();
  </script>
</body>
</html>
